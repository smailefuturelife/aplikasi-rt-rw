<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lengkapi Data Kartu Keluarga - RT/RW Digital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #3f9def, #00f2fe);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .form-card {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      max-width: 950px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .btn-submit {
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      border: none;
      border-radius: 10px;
      font-weight: 600;
      padding: 12px;
      width: 100%;
      transition: 0.3s;
    }
    .btn-submit:hover {
      opacity: 0.9;
    }
    .form-section {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      background: #f9f9f9;
    }
    #message {
      display: none;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h4 class="text-center mb-4">📝 Lengkapi Biodata Kartu Keluarga</h4>
    <p class="text-muted text-center mb-4">
      Silakan isi data KK dan anggota keluarga agar akun bisa digunakan.
    </p>
    
    <div id="message" class="alert text-center"></div>

    <form id="dataForm">
      <!-- Data KK -->
      <div class="form-section">
        <h6 class="mb-3"><i class="bi bi-card-list"></i> Data Kartu Keluarga</h6>
        <div class="mb-3">
          <label for="no_kk" class="form-label">Nomor KK</label>
          <input type="text" id="no_kk" class="form-control" required placeholder="Masukkan nomor KK">
        </div>
        <div class="mb-3">
          <label for="alamat" class="form-label">Alamat KK</label>
          <input type="text" id="alamat" class="form-control" required placeholder="Masukkan alamat lengkap">
        </div>
      </div>

      <!-- Anggota Keluarga -->
      <div class="form-section">
        <h6 class="mb-3"><i class="bi bi-people"></i> Anggota Keluarga</h6>
        <div id="anggotaList">
          <div class="row anggota mb-3">
            <div class="col-md-3">
              <input type="text" class="form-control" placeholder="NIK" required>
            </div>
            <div class="col-md-3">
              <input type="text" class="form-control" placeholder="Nama" required>
            </div>
            <div class="col-md-3">
              <input type="text" class="form-control" placeholder="Alamat" required>
            </div>
            <div class="col-md-3">
              <select class="form-control" required>
                <option value="">Hubungan</option>
                <option value="Bapak">Bapak</option>
                <option value="Ibu">Ibu</option>
                <option value="Anak">Anak</option>
              </select>
            </div>
          </div>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="tambahAnggota()">
          + Tambah Anggota
        </button>
      </div>

      <button type="submit" class="btn btn-submit">
        <i class="bi bi-save"></i> Simpan Data
      </button>
    </form>
  </div>

  <script>
    const username = localStorage.getItem("username"); 
    const messageBox = document.getElementById("message");

    if (!username) {
      window.location.href = "/loginpage";
    }

    function tambahAnggota() {
      const anggotaDiv = document.createElement("div");
      anggotaDiv.className = "row anggota mb-3";
      anggotaDiv.innerHTML = `
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="NIK" required>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="Nama" required>
        </div>
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="Alamat" required>
        </div>
        <div class="col-md-3">
          <select class="form-control" required>
            <option value="">Hubungan</option>
            <option value="Bapak">Bapak</option>
            <option value="Ibu">Ibu</option>
            <option value="Anak">Anak</option>
          </select>
        </div>
      `;
      document.getElementById("anggotaList").appendChild(anggotaDiv);
    }

    document.getElementById("dataForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const no_kk = document.getElementById("no_kk").value.trim();
      const alamat = document.getElementById("alamat").value.trim();

      // Ambil anggota keluarga
      const anggota = [];
      document.querySelectorAll("#anggotaList .anggota").forEach(div => {
        const inputs = div.querySelectorAll("input");
        const select = div.querySelector("select");
        anggota.push({
          nik: inputs[0].value,
          nama: inputs[1].value,
          alamat: inputs[2].value,
          hubungan: select.value
        });
      });

      try {
        const response = await fetch(`http://127.0.0.1:8000/isi-data-kk/${username}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ no_kk, alamat, anggota })
        });

        const result = await response.json();

        if (response.ok) {
          messageBox.className = "alert alert-success text-center";
          messageBox.textContent = "✅ Data berhasil disimpan!";
          messageBox.style.display = "block";

          setTimeout(() => {
            window.location.href = "/dashboard_masyarakat.html";
          }, 1500);
        } else {
          messageBox.className = "alert alert-danger text-center";
          messageBox.textContent = "❌ Gagal: " + (result.detail || "Terjadi kesalahan");
          messageBox.style.display = "block";
        }
      } catch (error) {
        messageBox.className = "alert alert-warning text-center";
        messageBox.textContent = "⚠️ Nomor KK sudah terdaftar";
        messageBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
